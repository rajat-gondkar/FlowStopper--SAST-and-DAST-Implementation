# FlowStopper's OWN override for the PyGoat benchmark. This is our orchestration wrapper, NOT part
# of PyGoat and NOT vendored from it. Layered on top of the cloned bench/pygoat/src/docker-compose.yml
# by scripts/bench_fetch.sh. It publishes the app on 127.0.0.1 only (not 0.0.0.0) on a non-clashing
# port, and gives the web service the network alias `pygoat` so FlowStopper can reach it by name when
# run inside the same compose network (the name is allow-listed via ALLOWED_HOSTS by `make bench`).
#
# Note: Docker Compose concatenates `ports` across files, so the base 8000 mapping may also remain;
# always target the 127.0.0.1:${BENCH_PORT} address below.
services:
  web:
    ports:
      - "127.0.0.1:${BENCH_PORT:-8100}:8000"
    networks:
      default:
        aliases:
          - pygoat
